<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SiteMaster Console</title>
    <!-- SDK Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0f172a);
            --text-color: var(--tg-theme-text-color, #f8fafc);
            --hint-color: var(--tg-theme-hint-color, #94a3b8);
            --button-color: var(--tg-theme-button-color, #2563eb);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #1e293b);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .header {
            margin-bottom: 20px;
        }

        .header h2 {
            margin: 0 0 6px 0;
            font-size: 20px;
        }

        .header p {
            margin: 0;
            color: var(--hint-color);
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-color);
        }

        select, textarea, input[type="file"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: var(--secondary-bg);
            color: var(--text-color);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: var(--button-color);
            color: var(--button-text-color);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status-msg {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
            text-align: center;
        }

        .status-success {
            background-color: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border: 1px solid #22c55e;
        }

        .status-error {
            background-color: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid #ef4444;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2 id="welcome-title">Console Gestione Sito</h2>
        <p id="user-info">Invia una modifica visiva o un aggiornamento testo.</p>
    </div>

    <form id="update-form">
        <!-- 1. Selezione Pagina -->
        <div class="form-group">
            <label for="target_page">Pagina da modificare</label>
            <select id="target_page" name="target_page" required>
                <option value="index.html">Home Page</option>
                <option value="menu.html">Menu / Listino Servizi</option>
                <option value="chi-siamo.html">Chi Siamo</option>
                <option value="contatti.html">Contatti</option>
            </select>
        </div>

        <!-- 2. Tipo di Modifica -->
        <div class="form-group">
            <label for="action_type">Tipo di operazione</label>
            <select id="action_type" name="action_type" required>
                <option value="TEXT_PRICE">📝 Modifica Testo o Prezzo</option>
                <option value="UPDATE_PHOTO">📸 Sostituisci / Aggiungi Foto</option>
                <option value="ADD_ITEM">➕ Aggiungi Nuovo Elemento</option>
                <option value="NOTICE">💬 Inserisci Avviso / Comunicazione</option>
            </select>
        </div>

        <!-- 3. Dettaglio Istruzione -->
        <div class="form-group">
            <label for="instruction">Descrizione della modifica</label>
            <textarea id="instruction" name="instruction" placeholder="Es: Cambia il costo della Pizza Margherita da 7€ a 8€..." required></textarea>
        </div>

        <!-- 4. Immagine (Opzionale) -->
        <div class="form-group">
            <label for="image_file">Carica Immagine (Opzionale)</label>
            <input type="file" id="image_file" name="image_file" accept="image/*">
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">🚀 Applica Modifica</button>
    </form>

    <div id="status-msg"></div>

    <script>
        // Inizializzazione SDK Telegram
        const tg = window.Telegram.WebApp;
        tg.expand(); // Espande la Mini App a schermo intero

        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('welcome-title').innerText = `Ciao ${user.first_name} 👋`;
        }

        const form = document.getElementById('update-form');
        const submitBtn = document.getElementById('submit-btn');
        const statusMsg = document.getElementById('status-msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.innerText = "⏳ Elaborazione IA in corso...";
            statusMsg.style.display = "none";

            const formData = new FormData();
            formData.append("telegram_id", user ? user.id : "demo_user");
            formData.append("target_page", document.getElementById('target_page').value);
            formData.append("action_type", document.getElementById('action_type').value);
            formData.append("instruction", document.getElementById('instruction').value);

            const fileInput = document.getElementById('image_file');
            if (fileInput.files[0]) {
                formData.append("image", fileInput.files[0]);
            }

            try {
                // Sostituisci con l'URL reale del tuo server Python (es. Ngrok o server cloud)
                const response = await fetch("https://TUO-BACKEND-PYTHON.com/api/v1/update-site", {
                    method: "POST",
                    body: formData
                });

                if (response.ok) {
                    statusMsg.className = "status-success";
                    statusMsg.innerText = "✅ Modifica applicata con successo sul sito!";
                    form.reset();
                } else {
                    throw new Error("Errore durante l'aggiornamento.");
                }
            } catch (err) {
                statusMsg.className = "status-error";
                statusMsg.innerText = "❌ Richiesta inviata in modalità Demo (Server non collegato).";
            } finally {
                statusMsg.style.display = "block";
                submitBtn.disabled = false;
                submitBtn.innerText = "🚀 Applica Modifica";
            }
        });
    </script>
</body>
</html>
